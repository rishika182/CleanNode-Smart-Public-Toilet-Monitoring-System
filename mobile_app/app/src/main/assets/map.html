<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #E8ECEF;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #map-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #vector-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #EAF0F2;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: transparent;
        }
        .leaflet-container {
            background: transparent !important;
        }
        .leaflet-div-icon, .custom-facility-pin, .user-marker, .eta-bubble {
            background: transparent !important;
            border: none !important;
        }
        .monitored-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            padding: 4px 8px;
            color: #ffffff;
            font-weight: 800;
            font-size: 11px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.35);
            border: 2px solid #ffffff;
            white-space: nowrap;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            transform: scale(1);
            transition: transform 0.2s ease;
        }
        .monitored-pin:hover, .monitored-pin:active {
            transform: scale(1.1);
        }
        .unmonitored-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #607D8B;
            border-radius: 12px;
            padding: 4px 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
            border: 1.5px solid #ffffff;
            white-space: nowrap;
            cursor: pointer;
        }
        .user-dot {
            width: 20px;
            height: 20px;
            background: #1976D2;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(25,118,210,0.95);
            animation: pulse-user 2s infinite;
        }
        @keyframes pulse-user {
            0% { box-shadow: 0 0 0 0 rgba(25, 118, 210, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(25, 118, 210, 0); }
            100% { box-shadow: 0 0 0 0 rgba(25, 118, 210, 0); }
        }
        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            padding: 4px;
        }
        .eta-callout {
            background: #004D40;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 5px 9px;
            border-radius: 14px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.35);
            border: 1.5px solid #ffffff;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <!-- High-res vector map of Bengaluru roads and parks (instant, zero-network fallback) -->
        <canvas id="vector-bg"></canvas>
        <div id="map"></div>
    </div>

    <script src="leaflet/leaflet.js"></script>
    <script>
        console.log("CleanNode map.html script loaded");

        // 1. Draw Vector Bengaluru Roads, Lakes & Parks on background canvas
        function drawBengaluruVectorMap() {
            var canvas = document.getElementById('vector-bg');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var w = canvas.width = window.innerWidth;
            var h = canvas.height = window.innerHeight;

            // Base urban land
            ctx.fillStyle = "#EAEFF2";
            ctx.fillRect(0, 0, w, h);

            // Parks (Lalbagh, Cubbon Park, Madhavan Park)
            ctx.fillStyle = "#D4EBD6";
            ctx.beginPath();
            ctx.ellipse(w * 0.45, h * 0.38, w * 0.18, h * 0.12, 0.2, 0, Math.PI * 2); // Lalbagh
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(w * 0.52, h * 0.18, w * 0.15, h * 0.08, -0.3, 0, Math.PI * 2); // Cubbon Park
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(w * 0.35, h * 0.65, w * 0.12, h * 0.07, 0, 0, Math.PI * 2); // Jayanagar Park
            ctx.fill();

            // Lakes (Ulsoor, Bellandur, Sankey)
            ctx.fillStyle = "#D2E4F2";
            ctx.beginPath();
            ctx.ellipse(w * 0.72, h * 0.25, w * 0.14, h * 0.06, 0.4, 0, Math.PI * 2); // Ulsoor Lake
            ctx.fill();

            // City Grid / Arterial Roads
            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = 9;
            ctx.lineCap = "round";

            // Ring Roads & Arterials
            var roads = [
                // MG Road / Hosur Road corridor
                [[w * 0.2, h * 0.1], [w * 0.5, h * 0.4], [w * 0.8, h * 0.85]],
                // Outer Ring Road (horizontal arc)
                [[0, h * 0.55], [w * 0.3, h * 0.52], [w * 0.7, h * 0.56], [w, h * 0.52]],
                // 100ft Road Indiranagar
                [[w * 0.65, 0], [w * 0.68, h * 0.45], [w * 0.65, h * 0.8]],
                // Jayanagar 9th Main / Kanakapura Road
                [[w * 0.35, 0], [w * 0.32, h * 0.5], [w * 0.28, h]],
                // Koramangala 80ft Road
                [[w * 0.45, h * 0.42], [w * 0.85, h * 0.6]],
                // Secondary grid lines
                [[0, h * 0.3], [w, h * 0.32]],
                [[0, h * 0.75], [w, h * 0.73]],
                [[w * 0.15, 0], [w * 0.18, h]],
                [[w * 0.5, 0], [w * 0.52, h]],
                [[w * 0.82, 0], [w * 0.8, h]]
            ];

            roads.forEach(function(r) {
                ctx.beginPath();
                ctx.moveTo(r[0][0], r[0][1]);
                for (var i = 1; i < r.length; i++) {
                    ctx.lineTo(r[i][0], r[i][1]);
                }
                ctx.stroke();
            });

            // Road center lines
            ctx.strokeStyle = "#FDE68A";
            ctx.lineWidth = 3;
            [roads[0], roads[1], roads[2], roads[3]].forEach(function(r) {
                ctx.beginPath();
                ctx.moveTo(r[0][0], r[0][1]);
                for (var i = 1; i < r.length; i++) {
                    ctx.lineTo(r[i][0], r[i][1]);
                }
                ctx.stroke();
            });

            // District Labels
            ctx.fillStyle = "#8C9BA5";
            ctx.font = "bold 13px -apple-system, sans-serif";
            ctx.fillText("JAYANAGAR", w * 0.25, h * 0.58);
            ctx.fillText("INDIRANAGAR", w * 0.62, h * 0.32);
            ctx.fillText("KORAMANGALA", w * 0.55, h * 0.68);
            ctx.fillText("MAJESTIC", w * 0.35, h * 0.22);
            ctx.fillText("LALBAGH BOTANICAL", w * 0.38, h * 0.4);
        }

        window.addEventListener('resize', drawBengaluruVectorMap);
        drawBengaluruVectorMap();

        // 2. Leaflet Map Initialization
        var defaultFacilities = [
            { id: "CN-BLR-01", name: "Jayanagar BBMP-01", address: "9th Main, Jayanagar, Bengaluru", lat: 12.9298, lng: 77.5838, isMonitored: true, pci: 99, color: "#2E7D32", distanceMeters: 220 },
            { id: "CN-BLR-02", name: "Indira Nagar 100ft Rd", address: "100 Feet Rd, HAL 2nd Stage, Bengaluru", lat: 12.9719, lng: 77.6412, isMonitored: true, pci: 64, color: "#F57C00", distanceMeters: 740 },
            { id: "CN-BLR-03", name: "Jayanagar BBMP-03", address: "Jayanagar · Mens, Womens", lat: 12.9340, lng: 77.5890, isMonitored: true, pci: 54, color: "#F57C00", distanceMeters: 450 },
            { id: "CN-BLR-04", name: "Cubbon Park BBMP-01", address: "Cubbon Park, Bengaluru", lat: 12.9756, lng: 77.6068, isMonitored: true, pci: 32, color: "#D32F2F", distanceMeters: 1100 },
            { id: "CN-BLR-05", name: "Majestic KSRTC Terminal BBMP", address: "KSRTC Concourse, Majestic", lat: 12.9767, lng: 77.5713, isMonitored: true, pci: 24, color: "#D32F2F", distanceMeters: 1800 }
        ];

        var facilities = defaultFacilities;
        var map = null;
        var markers = {};
        var routePolyline = null;
        var routeEtaMarker = null;
        var userLocation = [12.9320, 77.5850];

        function initMap() {
            try {
                if (map) return;
                if (typeof L === 'undefined') {
                    setTimeout(initMap, 100);
                    return;
                }
                console.log("Leaflet L is ready! Initializing map view...");

                map = L.map('map', {
                    zoomControl: false,
                    attributionControl: false
                }).setView(userLocation, 14);

                // Tier 1: Google Maps Roadmap (exact match to Google Maps, fast edge CDN in Bengaluru)
                var googleLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                    maxZoom: 20,
                    subdomains: ['0', '1', '2', '3'],
                    attribution: '© Google Maps'
                });

                // Tier 2: ESRI World Street Map (HTTP/1.1 standard, extremely fast, clear roads, zero SPDY drops)
                var esriLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19,
                    attribution: '© Esri'
                });

                // Tier 3: OpenStreetMap
                var osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                });

                googleLayer.on('tileerror', function() {
                    console.warn("Google tile error, falling back to ESRI");
                    if (!map.hasLayer(esriLayer)) map.addLayer(esriLayer);
                });

                esriLayer.on('tileerror', function() {
                    console.warn("ESRI tile error, falling back to OSM");
                    if (!map.hasLayer(osmLayer)) map.addLayer(osmLayer);
                });

                // Add Google Maps primary layer
                googleLayer.addTo(map);

                // User Location Pin
                var userIcon = L.divIcon({
                    className: 'user-marker',
                    html: '<div class="user-dot"></div>',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                L.marker(userLocation, { icon: userIcon }).addTo(map).bindTooltip("📍 You (Bengaluru)", { permanent: false, direction: 'top' });

                renderFacilities();

                function triggerResize() {
                    if (map) {
                        map.invalidateSize(true);
                        console.log("Map size: " + map.getSize().x + "x" + map.getSize().y);
                    }
                }
                setTimeout(triggerResize, 100);
                setTimeout(triggerResize, 350);
                setTimeout(triggerResize, 800);
                setTimeout(triggerResize, 1500);

                if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                    window.AndroidBridge.onMapReady();
                }
                console.log("CleanNode map initialization complete");
            } catch(e) {
                console.error("Map init error:", e);
            }
        }

        function renderFacilities() {
            if (!map || typeof L === 'undefined' || !facilities) return;
            facilities.forEach(function(f) {
                var iconHtml = '';
                if (f.isMonitored) {
                    iconHtml = '<div class="monitored-pin" style="background:' + f.color + ';">🟢 ' + f.pci + '</div>';
                } else {
                    iconHtml = '<div class="unmonitored-pin">🚻 STD</div>';
                }

                var customIcon = L.divIcon({
                    className: 'custom-facility-pin',
                    html: iconHtml,
                    iconSize: [54, 28],
                    iconAnchor: [27, 14]
                });

                var m = L.marker([f.lat, f.lng], { icon: customIcon }).addTo(map);

                var popupContent = '<div style="font-family:sans-serif; min-width:210px; padding:4px;">' +
                    '<div style="font-weight:bold; font-size:13px; color:#004D40;">' + f.name + '</div>' +
                    '<div style="font-size:11px; margin-top:3px; color:' + (f.isMonitored ? f.color : '#607D8B') + '; font-weight:bold;">' +
                    (f.isMonitored ? '🟢 CleanNode IoT Monitored (' + f.pci + '/100)' : '⚪ Standard Public Restroom (No Sensors)') +
                    '</div>' +
                    '<div style="font-size:11px; color:#666; margin-top:3px;">' + f.address + '</div>' +
                    '<div style="font-size:11px; color:#00685F; margin-top:3px; font-weight:600;">Distance: ~' + f.distanceMeters + 'm (~' + Math.max(1, Math.round(f.distanceMeters / 70)) + ' min walk)</div>' +
                    '<div style="margin-top:8px; display:flex; gap:6px;">' +
                    '<button onclick="drawWalkingRoute(' + f.lat + ',' + f.lng + ',\'' + f.id + '\')" style="flex:1; background:#00685F; color:white; border:none; padding:7px 10px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;">🚶 In-App Walk Route</button>' +
                    '</div></div>';

                m.bindPopup(popupContent);
                m.on('click', function() {
                    if (window.AndroidBridge && window.AndroidBridge.onSelectFacility) {
                        window.AndroidBridge.onSelectFacility(f.id);
                    }
                });
                markers[f.id] = m;
            });
        }

        window.updateFacilities = function(newFacilities) {
            try {
                if (newFacilities && newFacilities.length > 0) {
                    facilities = newFacilities;
                }
                if (!map) return;
                for (var id in markers) {
                    if (markers[id]) map.removeLayer(markers[id]);
                }
                markers = {};
                renderFacilities();
                map.invalidateSize(true);
            } catch(e) {
                console.error("Update facilities error:", e);
            }
        };

        window.drawWalkingRoute = function(destLat, destLng, facId) {
            try {
                if (!map) initMap();
                if (routePolyline) {
                    map.removeLayer(routePolyline);
                    routePolyline = null;
                }
                if (routeEtaMarker) {
                    map.removeLayer(routeEtaMarker);
                    routeEtaMarker = null;
                }

                function renderStraightLine() {
                    var latlngs = [
                        userLocation,
                        [destLat, destLng]
                    ];
                    routePolyline = L.polyline(latlngs, {
                        color: '#00897B',
                        weight: 6,
                        opacity: 0.95,
                        dashArray: '8, 8'
                    }).addTo(map);
                    map.fitBounds(routePolyline.getBounds(), { padding: [60, 60] });
                    if (window.AndroidBridge && window.AndroidBridge.onRouteDrawn) {
                        window.AndroidBridge.onRouteDrawn(facId);
                    }
                }

                // Fetch street walking path from OSRM
                var osrmUrl = 'https://router.project-osrm.org/route/v1/walking/' + 
                    userLocation[1] + ',' + userLocation[0] + ';' + 
                    destLng + ',' + destLat + 
                    '?overview=full&geometries=geojson';

                var req = new XMLHttpRequest();
                req.timeout = 2500;
                req.onreadystatechange = function() {
                    if (req.readyState === 4) {
                        if (req.status === 200) {
                            try {
                                var data = JSON.parse(req.responseText);
                                if (data && data.routes && data.routes.length > 0 && data.routes[0].geometry) {
                                    var coords = data.routes[0].geometry.coordinates;
                                    var leafletCoords = coords.map(function(c) { return [c[1], c[0]]; });
                                    var durationSec = Math.round(data.routes[0].duration);
                                    var distanceM = Math.round(data.routes[0].distance);
                                    var mins = Math.max(1, Math.round(durationSec / 60));

                                    routePolyline = L.polyline(leafletCoords, {
                                        color: '#00897B',
                                        weight: 6,
                                        opacity: 0.95
                                    }).addTo(map);

                                    // Add ETA Callout Bubble at midpoint (matches Google Maps Compute Routes)
                                    var midIdx = Math.floor(leafletCoords.length / 2);
                                    var midPoint = leafletCoords[midIdx];
                                    var etaHtml = '<div class="eta-callout">🚶 ' + mins + ' min (' + distanceM + 'm)</div>';
                                    var etaIcon = L.divIcon({
                                        className: 'eta-bubble',
                                        html: etaHtml,
                                        iconAnchor: [35, 15]
                                    });
                                    routeEtaMarker = L.marker(midPoint, { icon: etaIcon }).addTo(map);

                                    map.fitBounds(routePolyline.getBounds(), { padding: [60, 60] });
                                    if (window.AndroidBridge && window.AndroidBridge.onRouteDrawn) {
                                        window.AndroidBridge.onRouteDrawn(facId);
                                    }
                                    return;
                                }
                            } catch(e) {
                                console.error("OSRM parse err", e);
                            }
                        }
                        renderStraightLine();
                    }
                };
                req.ontimeout = function() { renderStraightLine(); };
                req.onerror = function() { renderStraightLine(); };
                req.open('GET', osrmUrl, true);
                req.send();
            } catch(e) {
                console.error("Route error:", e);
                renderStraightLine();
            }
        };

        window.clearWalkingRoute = function() {
            if (routePolyline && map) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }
            if (routeEtaMarker && map) {
                map.removeLayer(routeEtaMarker);
                routeEtaMarker = null;
            }
            if (map) map.setView(userLocation, 14);
        };

        window.selectAndFocusFacility = function(id, lat, lng) {
            if (map) {
                map.setView([lat, lng], 16, { animate: true });
                if (markers[id]) {
                    markers[id].openPopup();
                }
                map.invalidateSize(true);
            }
        };

        // Periodic resize observer to avoid 0x0 layout freeze
        setInterval(function() {
            if (map) {
                map.invalidateSize(true);
            }
        }, 800);

        document.addEventListener('DOMContentLoaded', initMap);
        setTimeout(initMap, 50);
    </script>
</body>
</html>
